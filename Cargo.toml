[workspace]
members = ["crates/api", "crates/domain", "crates/db", "crates/shared"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["QR Link Team"]

[workspace.dependencies]
actix-web = "4"
actix-rt = "2"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
qrcode = "0.12"
user-agent = "0.1"
image = "0.24"
dotenv = "0.15"
log = "0.4"
env_logger = "0.10"
