[workspace]
members = ["crates/api", "crates/domain", "crates/db", "crates/shared"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["QR Link Team"]
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.39", features = ["full"] }
async-trait = "0.1"

# HTTP stack (Axum)
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "compression-gzip", "request-id"] }
hyper = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors & logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "time",
    "json",
    "macros",
    "migrate",
] }

# IDs & time
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }

# Auth/crypto
jsonwebtoken = "9"
rand = "0.8"

# Validation
validator = { version = "0.18", features = ["derive"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "uuid", "time"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# QR generation
qrcode = "0.14"
image = "0.25"

# Config
dotenvy = "0.15"
config = { version = "0.14", default-features = false, features = ["toml"] }

# generic-auth git deps
generic-auth-auth = { git = "https://github.com/Sonit90/rust-generic-user-backend.git", branch = "main" }
generic-auth-core = { git = "https://github.com/Sonit90/rust-generic-user-backend.git", branch = "main" }
generic-auth-db = { git = "https://github.com/Sonit90/rust-generic-user-backend.git", branch = "main" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
