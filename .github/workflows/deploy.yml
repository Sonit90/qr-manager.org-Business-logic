name: Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_LATEST=ghcr.io/${REPO_LC}:latest" >> $GITHUB_ENV
          echo "IMAGE_SHA=ghcr.io/${REPO_LC}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build \
            -t "${{ env.IMAGE_LATEST }}" \
            -t "${{ env.IMAGE_SHA }}" .

      - name: Push image
        run: |
          docker push "${{ env.IMAGE_LATEST }}"
          docker push "${{ env.IMAGE_SHA }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Production(Hetzner)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LC}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Write .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf "%s\nIMAGE_NAME=%s\n" "${ENV_FILE}" "${{ env.IMAGE_NAME }}" > .env

      - name: Copy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'docker-compose.yml,.env'
          target: 'qr-app'

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd "$HOME/qr-app"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
