version: '3.8'

# Shared Postgres for both auth (rust-generic-user-backend) and qr-api.
# Each service migrates its own schema:
#   - auth schema: owned by auth service
#   - qr schema: owned by qr-api
# Both services must point DATABASE_URL to the same Postgres instance + db.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shared
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
